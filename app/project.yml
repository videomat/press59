name: Press59
options:
  bundleIdPrefix: win.press59
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Press59:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Press59
    dependencies:
      - package: Sparkle
    configFiles:
      Debug: Config/Signing.local.xcconfig
      Release: Config/Signing.local.xcconfig
    info:
      path: Press59/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        # Sparkle updates: the feed is built from the release in R2 (functions/appcast.xml.js),
        # and only updates signed with the matching private key are installed.
        SUFeedURL: https://press59.win/appcast.xml
        SUPublicEDKey: GZsyOz9IVVdNHAylmqrrCU6XvMO/be6KhgZCFPDfodY=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: win.press59.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 5
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          # Its own app to macOS, so Xcode builds get their own Accessibility entry and settings
          # instead of taking over the installed Press59's (whose signature they don't match).
          # System Settings lists apps by file name, hence the name.
          PRODUCT_BUNDLE_IDENTIFIER: win.press59.app.debug
          PRODUCT_NAME: Press59 Debug
          PRODUCT_MODULE_NAME: Press59
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: Apple Development
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
  Press59Tests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    # Only the app's pure logic, so the tests never start Press59 or touch the keyboard.
    sources:
      - path: Press59Tests
      - path: Press59/HyperKeyLogic.swift
      - path: Press59/KeyMappings.swift
      - path: Press59/KeySuggestions.swift
      - path: Press59/WindowLayout.swift
    configFiles:
      Debug: Config/Signing.local.xcconfig
      Release: Config/Signing.local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: win.press59.app.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Press59:
    build:
      targets:
        Press59: all
        Press59Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Press59Tests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
